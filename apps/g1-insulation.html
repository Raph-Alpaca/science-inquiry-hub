<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>단열 재료 비교 · 과학탐구 앱 허브</title>
<link rel="stylesheet" href="../assets/hub.css">
<style>
  .cups { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .cup { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 8px 12px; border-radius: var(--radius-s); background: var(--paper); font-size: .93em; }
  .cup i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  .cup span { color: var(--ink-2); }
  .cup b { font-size: 1.45em; font-variant-numeric: tabular-nums; margin-left: auto; }
  #c { cursor: crosshair; }
</style>
</head>
<body>
<section class="lab">
  <div class="stage">
    <div class="cups" aria-live="off">
      <div class="cup"><i style="background:#23a087"></i>컵 A <span id="matA"></span><b id="tA">–</b></div>
      <div class="cup"><i style="background:#ee6b57"></i>컵 B <span id="matB"></span><b id="tB">–</b></div>
    </div>
    <canvas id="c" role="img" aria-label="시간에 따른 두 컵의 온도 그래프"></canvas>
    <p class="cap">그래프를 누르면 그 시각이 메모 시각으로 정해집니다. 오른쪽 칸에 메모를 적고 남기세요.</p>
  </div>
  <aside class="controls">
    <h3>실험 조건</h3>
    <div class="field"><label for="selA">컵 A를 감싼 재료</label>
      <select id="selA"><option value="none">아무것도 안 감쌈</option><option value="paper">종이 한 겹</option><option value="foil">알루미늄 포일</option><option value="styro" selected>스티로폼</option><option value="wool">양털 천</option></select></div>
    <div class="field"><label for="selB">컵 B를 감싼 재료</label>
      <select id="selB"><option value="none" selected>아무것도 안 감쌈</option><option value="paper">종이 한 겹</option><option value="foil">알루미늄 포일</option><option value="styro">스티로폼</option><option value="wool">양털 천</option></select></div>
    <div class="field"><label for="t0">처음 물 온도 <b></b></label><input type="range" id="t0" min="50" max="90" value="80"></div>
    <div class="field"><label for="env">교실 온도 <b></b></label><input type="range" id="env" min="10" max="30" value="20"></div>
    <p class="hint" id="condHint">조건을 바꾸면 실험이 처음부터 다시 시작됩니다.</p>
    <div class="row"><button class="btn primary" id="run">냉각 시작</button><button class="btn" id="reset">처음부터</button></div>
    <div class="readout"><div><small>경과 시간</small><b id="time">0분</b></div><div><small>두 컵 온도 차</small><b id="diff">0.0 ℃</b></div></div>
    <h3>관찰 메모</h3>
    <div class="field">
      <label for="memo">메모 시각 <b id="memoAt">지금</b></label>
      <div class="row"><input type="text" id="memo" placeholder="지금 보이는 것" style="flex:1"><button class="btn small" id="addMemo">남기기</button></div>
    </div>
    <ul class="list" id="memos"></ul>
  </aside>
</section>
<script src="../assets/hub.js"></script>
<script>
window.APP = {
  id: "g1-insulation", grade: 1, unit: "열", sensor: "온도 센서 2개",
  title: "단열 재료 비교",
  question: "어떤 재료로 감싸야 뜨거운 물이 가장 천천히 식을까?",
  how: "두 컵을 다른 재료로 감싸고 냉각 그래프를 겹쳐 보세요. 차이가 벌어지는 순간에 메모를 남기면 그래프 위에 표시됩니다.",
  notes: ["어느 컵이 더 천천히 식을까요? 재료의 어떤 성질 때문일까요?", "몇 분에 온도 차가 몇 ℃까지 벌어졌나요? 그래프 모양은?", "단열·열의 이동(전도·대류·복사) 개념으로 설명해 보세요."],
  prompt: "중학교 1학년 '열' 단원용 웹앱을 만들어 줘. 뜨거운 물이 든 두 컵을 서로 다른 재료(없음/종이/알루미늄 포일/스티로폼/양털)로 감싸고 시간에 따라 식는 온도를 한 그래프에 두 색으로 겹쳐 보여 줘. 처음 물 온도와 교실 온도를 바꿀 수 있고, 학생이 특정 시각에 관찰 메모를 남기면 그래프 위에 점으로 표시해 줘. 냉각은 뉴턴 냉각 법칙(주변 온도와의 차이에 비례)으로 계산하고, 재료마다 냉각 상수를 다르게 해 줘. 온도 센서 2개로 실제 값을 받을 수 있게 데이터 소스 자리를 비워 둬.",
  next: "실제 컵으로 같은 실험을 하면 그래프가 이 모양과 어디가 다를까? 그 차이는 프롬프트에 어떤 조건을 추가해야 반영될까?"
};
SIH.shell();

// 뉴턴 냉각: T(t) = T교실 + (T처음 − T교실)·e^(−k·t), k 단위 1/분 (단순화한 값)
const K = { none: 0.055, paper: 0.045, foil: 0.050, styro: 0.020, wool: 0.026 };
const NAME = { none: "감싸지 않음", paper: "종이", foil: "포일", styro: "스티로폼", wool: "양털 천" };
const TMAX = 60, SPEED = 2.5; // 실제 1초 = 2.5분
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = SIH.dpr(cv, 760, 360);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let t = 0, state = "idle", memos = [], T0 = 80, Tenv = 20, last = 0, memoAt = null;
const temp = (k, tt) => Tenv + (T0 - Tenv) * Math.exp(-k * tt);
const selA = $("selA"), selB = $("selB");
const WORDS = { idle: "냉각 시작", running: "일시정지", paused: "계속", done: "60분 끝" };

function reset() {
  state = "idle"; t = 0; memos = []; memoAt = null;
  SIH.label($("run"), "idle", WORDS); renderMemos(); updMemoAt(); draw();
}
// 조건이 바뀌면 이미 그린 곡선과 맞지 않으므로 처음부터
const onCond = () => { if (t > 0) reset(); else draw(); };
SIH.bind("t0", v => { T0 = v; onCond(); }, " ℃");
SIH.bind("env", v => { Tenv = v; onCond(); }, " ℃");
[selA, selB].forEach(s => s.addEventListener("change", onCond));

function draw() {
  const kA = K[selA.value], kB = K[selB.value];
  $("matA").textContent = NAME[selA.value];
  $("matB").textContent = NAME[selB.value];
  const pa = [], pb = [];
  for (let s = 0; s < t; s += 0.25) { pa.push([s, temp(kA, s)]); pb.push([s, temp(kB, s)]); }
  pa.push([t, temp(kA, t)]); pb.push([t, temp(kB, t)]);
  const yMax = Math.ceil((T0 + 5) / 10) * 10;
  const series = [
    { pts: [[0, Tenv], [TMAX, Tenv]], color: "#9db3ae", dash: [5, 5], width: 1.4 },
    { pts: pa, color: "#23a087", width: 3 }, { pts: pb, color: "#ee6b57", width: 3 }
  ];
  if (memoAt != null) series.push({ pts: [[memoAt, 0], [memoAt, yMax]], color: "#e29a2a", width: 1.5, dash: [3, 4] });
  cv._map = SIH.drawChart(ctx, { x: 0, y: 0, w: 760, h: 360, xMin: 0, xMax: TMAX, yMin: 0, yMax, xTicks: 6, yTicks: yMax / 10, xLabel: "시간(분)", yLabel: "온도(℃)",
    legend: [{ label: "컵 A", color: "#23a087" }, { label: "컵 B", color: "#ee6b57" }, { label: "교실 온도", color: "#9db3ae", dash: [5, 5] }],
    series, marks: memos.map(m => ({ x: m.t, y: Math.max(temp(kA, m.t), temp(kB, m.t)), label: m.text.length > 10 ? m.text.slice(0, 10) + "…" : m.text })) });
  $("tA").textContent = temp(kA, t).toFixed(1) + " ℃";
  $("tB").textContent = temp(kB, t).toFixed(1) + " ℃";
  $("time").textContent = Math.floor(t) + "분";
  $("diff").textContent = Math.abs(temp(kA, t) - temp(kB, t)).toFixed(1) + " ℃";
}
function loop(now) {
  if (state !== "running") return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  t = Math.min(TMAX, t + dt * SPEED);
  if (t >= TMAX) { state = "done"; SIH.label($("run"), "done", WORDS); }
  draw();
  if (state === "running") requestAnimationFrame(loop);
}
$("run").onclick = () => {
  if (state === "running") state = "paused";
  else if (state !== "done") { state = "running"; last = performance.now(); requestAnimationFrame(loop); }
  SIH.label($("run"), state, WORDS);
};
$("reset").onclick = reset;

function updMemoAt() {
  $("memoAt").textContent = memoAt == null ? "지금" : Math.round(memoAt) + "분";
}
function addMemo() {
  const text = $("memo").value.trim();
  if (!text) { $("memo").focus(); return; }
  const at = memoAt == null ? t : memoAt;
  memos.push({ t: at, text }); memos.sort((a, b) => a.t - b.t);
  $("memo").value = ""; memoAt = null; updMemoAt(); renderMemos(); draw();
}
$("addMemo").onclick = addMemo;
$("memo").addEventListener("keydown", e => { if (e.key === "Enter") addMemo(); });
cv.addEventListener("click", ev => {
  const [X] = SIH.canvasXY(cv, ev, 760, 360);
  const [x] = cv._map.inv(X, 0);
  if (x < 0 || x > TMAX) return;
  memoAt = Math.max(0, Math.min(t, x)); updMemoAt(); draw(); $("memo").focus();
});
function renderMemos() {
  $("memos").innerHTML = memos.map((m, i) => `<li><span>${Math.round(m.t)}분 · ${esc(m.text)}</span><button class="x" data-i="${i}" aria-label="${Math.round(m.t)}분 메모 삭제">✕</button></li>`).join("");
  document.querySelectorAll("#memos .x").forEach(b => b.onclick = () => { memos.splice(+b.dataset.i, 1); renderMemos(); draw(); });
}
window.addEventListener("sih:resize", draw);
reset();
</script>
</body>
</html>
