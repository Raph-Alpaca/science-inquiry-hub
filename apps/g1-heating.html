<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>가열 곡선 실험실 · 과학탐구 앱 허브</title>
<link rel="stylesheet" href="../assets/hub.css">
<style>
  .stage .split { --cols: minmax(0, 1fr) 250px; }
  .side { --w: 240px; }
  .state { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 999px; background: var(--g-soft); color: var(--g-ink); font-weight: 700; }
  .side .tnow { color: var(--ink); font-size: 1.5em; font-weight: 800; display: block; margin-top: 4px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<section class="lab">
  <div class="stage">
    <div class="split">
      <canvas id="g" role="img" aria-label="가열 시간에 따른 온도 그래프"></canvas>
      <div class="side">
        <canvas id="p" role="img" aria-label="물 입자 모형 상자"></canvas>
        <span class="state" id="state">고체(얼음)</span>
        <b class="tnow" id="tnow">-20.0 ℃</b>
        <small>입자 색은 바뀌지 않아요. 같은 물 입자입니다.</small>
      </div>
    </div>
    <p class="cap" id="plateau">평평한 구간의 길이가 여기에 기록됩니다.</p>
  </div>
  <aside class="controls">
    <h3>가열 장치</h3>
    <div class="field"><label for="pw">가열 세기 <b></b></label><input type="range" id="pw" min="50" max="300" step="10" value="150"></div>
    <div class="field"><label for="spd">재생 속도</label>
      <select id="spd"><option value="10">10배 빠르게</option><option value="20" selected>20배 빠르게</option><option value="60">60배 빠르게</option></select></div>
    <div class="row"><button class="btn primary" id="heat">가열 시작</button><button class="btn" id="reset">얼음으로 되돌리기</button></div>
    <div class="readout">
      <div><small>경과 시간</small><b id="time">0 s</b></div>
      <div><small>넣어 준 열</small><b id="q">0.0 kJ</b></div>
      <div><small>녹은 비율</small><b id="melt">0 %</b></div>
      <div><small>기화한 비율</small><b id="boil">0 %</b></div>
    </div>
    <p class="hint">얼음 100 g(−20 ℃)에서 시작하고, 넣어 준 열은 모두 물질이 흡수한다고 가정합니다. 온도가 오르지 않는 구간에서 열은 어디로 갔을까요?</p>
    <h3>표시</h3>
    <div class="field"><label><input type="checkbox" id="showPlateau" checked> 평평한 구간 색칠하기</label></div>
  </aside>
</section>
<script src="../assets/hub.js"></script>
<script>
window.APP = {
  id: "g1-heating", grade: 1, unit: "물질의 상태 변화", sensor: "온도 센서",
  title: "가열 곡선 실험실",
  question: "얼음을 계속 가열하는데 온도가 오르지 않는 구간이 있는 이유는 무엇일까?",
  how: "가열 세기를 정하고 가열을 시작하세요. 왼쪽 그래프와 오른쪽 입자 배열이 동시에 바뀝니다.",
  notes: ["온도–시간 그래프는 어떤 모양일까요? 곧게 오를까요?", "온도가 멈춘 구간은 몇 ℃에서, 얼마나 오래였나요? 그때 입자는?", "상태 변화 중 열이 하는 일을 입자 운동과 배열로 설명해 보세요."],
  prompt: "중학교 1학년 '물질의 상태 변화' 단원용 웹앱을 만들어 줘. 얼음 100 g을 일정한 세기로 가열할 때 온도–시간 그래프를 실시간으로 그려 주고, 옆에는 입자 모형 상자를 두어 고체(규칙적 배열·제자리 진동)→액체(자유롭게 이동)→기체(멀리 퍼짐)로 배열과 움직임이 바뀌게 해 줘. 0 ℃와 100 ℃에서 온도가 멈추는 구간은 융해열·기화열을 흡수하는 시간으로 계산하고, 그 구간을 그래프에 색으로 표시할 수 있게 해 줘. 가열 세기는 슬라이더로 조절. 실제 온도 센서 값을 넣을 수 있는 자리를 남겨 둬.",
  next: "온도가 멈추는 구간의 길이는 무엇에 따라 달라질까? 가열 세기나 얼음의 양을 바꾸면? 그걸 확인하려면 어떤 기능을 프롬프트에 추가해야 할까?"
};
SIH.shell();

// 비열 J/(g·℃), 숨은열 J/g — 교과서 값
const m = 100, cI = 2.1, Lf = 334, cW = 4.18, Lv = 2260, cG = 2.0, T_END = 140;
const Q_melt0 = m * cI * 20, Q_melt1 = Q_melt0 + m * Lf, Q_boil0 = Q_melt1 + m * cW * 100, Q_boil1 = Q_boil0 + m * Lv, Q_END = Q_boil1 + m * cG * (T_END - 100);
const $ = id => document.getElementById(id);
const cg = $("g"), ctxG = SIH.dpr(cg, 480, 340);
const cp = $("p"), ctxP = SIH.dpr(cp, 240, 240);
let Q = 0, t = 0, state = "idle", last = 0, pts = [[0, -20]], P = 150, speed = 20;
let marks = {}; // 각 경계를 실제로 지난 시각 (가열 세기를 도중에 바꿔도 정확)
const WORDS = { idle: "가열 시작", running: "가열 멈춤", paused: "계속 가열", done: "140 ℃ 도달" };
SIH.bind("pw", v => P = v, " W");
$("spd").onchange = e => speed = +e.target.value;

const N = 36, COLS = 6;
const home = i => ({ x: 45 + (i % COLS) * 30, y: 72 + Math.floor(i / COLS) * 30 });
let parts = [];
function initParts() { parts = Array.from({ length: N }, (_, i) => ({ ...home(i), vx: 0, vy: 0 })); }

function stateOf(Q) {
  if (Q < Q_melt0) return { T: -20 + Q / (m * cI), s: "solid", melt: 0, boil: 0 };
  if (Q < Q_melt1) return { T: 0, s: "melting", melt: (Q - Q_melt0) / (m * Lf), boil: 0 };
  if (Q < Q_boil0) return { T: (Q - Q_melt1) / (m * cW), s: "liquid", melt: 1, boil: 0 };
  if (Q < Q_boil1) return { T: 100, s: "boiling", melt: 1, boil: (Q - Q_boil0) / (m * Lv) };
  return { T: Math.min(T_END, 100 + (Q - Q_boil1) / (m * cG)), s: "gas", melt: 1, boil: 1 };
}
const LABEL = { solid: "고체(얼음)", melting: "녹는 중(융해)", liquid: "액체(물)", boiling: "끓는 중(기화)", gas: "기체(수증기)" };

function drawGraph() {
  const tmax = Math.max(600, Math.ceil(t / 300) * 300);
  const bands = [];
  if ($("showPlateau").checked) {
    if (marks.m0 != null) bands.push({ x1: marks.m0, x2: marks.m1 ?? t, color: "#d6efe7" });
    if (marks.b0 != null) bands.push({ x1: marks.b0, x2: marks.b1 ?? t, color: "#fbe0da" });
  }
  SIH.drawChart(ctxG, { x: 0, y: 0, w: 480, h: 340, xMin: 0, xMax: tmax, yMin: -20, yMax: 140, xTicks: 6, yTicks: 8, xLabel: "시간(s)", yLabel: "온도(℃)", bands,
    series: [{ pts: [[0, 0], [tmax, 0]], color: "#c9d8d4", width: 1, dash: [4, 4] }, { pts: [[0, 100], [tmax, 100]], color: "#c9d8d4", width: 1, dash: [4, 4] }, { pts, color: "#23a087", width: 3 }] });
}

// 입자: 고체는 제자리 진동, 액체는 서로 붙어 아래에서 자유롭게, 기체는 상자 전체로 빠르게
function drawParts(st, dt) {
  const c = ctxP, f = Math.min(3, dt * 60), calm = SIH.reduced ? 0.35 : 1;
  c.clearRect(0, 0, 240, 240);
  c.fillStyle = "#f5f9f7"; c.fillRect(0, 0, 240, 240); c.strokeStyle = "#c9d8d4"; c.lineWidth = 1; c.strokeRect(0.5, 0.5, 239, 239);
  parts.forEach((p, i) => {
    const solid = st.s === "solid" || (st.s === "melting" && (N - 1 - i) / N >= st.melt);
    const gas = st.s === "gas" || (st.s === "boiling" && i / N < st.boil);
    if (solid) {
      const h = home(i), jit = (0.6 + Math.max(0, st.T + 20) / 20 * 1.4) * calm;
      p.x = h.x + (Math.random() - .5) * jit * 2; p.y = h.y + (Math.random() - .5) * jit * 2; p.vx = p.vy = 0;
    } else if (!gas) {
      const sp = (0.5 + st.T / 80) * calm;
      p.vx += (Math.random() - .5) * sp * f; p.vy += (Math.random() - .5) * sp * f; p.vx *= .9; p.vy *= .9;
      p.x += p.vx * f; p.y += p.vy * f;
      if (p.x < 13) { p.x = 13; p.vx = Math.abs(p.vx); } if (p.x > 227) { p.x = 227; p.vx = -Math.abs(p.vx); }
      if (p.y < 92) { p.y = 92; p.vy = Math.abs(p.vy); } if (p.y > 227) { p.y = 227; p.vy = -Math.abs(p.vy); }
    } else {
      const sp = (3 + Math.max(0, st.T - 100) / 20) * calm;
      const v = Math.hypot(p.vx, p.vy);
      if (v < sp * 0.8) { const a = Math.random() * Math.PI * 2; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; }
      p.x += p.vx * f; p.y += p.vy * f;
      if (p.x < 11) { p.x = 11; p.vx = Math.abs(p.vx); } if (p.x > 229) { p.x = 229; p.vx = -Math.abs(p.vx); }
      if (p.y < 11) { p.y = 11; p.vy = Math.abs(p.vy); } if (p.y > 229) { p.y = 229; p.vy = -Math.abs(p.vy); }
    }
    c.beginPath(); c.arc(p.x, p.y, 10.5, 0, Math.PI * 2);
    c.fillStyle = "#2c7fd1"; c.fill(); c.strokeStyle = "#1d5f9f"; c.lineWidth = 1; c.stroke();
  });
}
function render(dt) {
  const st = stateOf(Q);
  drawGraph(); drawParts(st, dt);
  $("state").textContent = LABEL[st.s];
  $("tnow").textContent = st.T.toFixed(1) + " ℃";
  $("time").textContent = Math.round(t) + " s";
  $("q").textContent = (Q / 1000).toFixed(1) + " kJ";
  $("melt").textContent = Math.floor(st.melt * 100) + " %";
  $("boil").textContent = Math.floor(st.boil * 100) + " %";
  const seg = [];
  if (marks.m0 != null) seg.push(`0 ℃ 구간 ${Math.round((marks.m1 ?? t) - marks.m0)} s${marks.m1 == null ? " (진행 중)" : ""}`);
  if (marks.b0 != null) seg.push(`100 ℃ 구간 ${Math.round((marks.b1 ?? t) - marks.b0)} s${marks.b1 == null ? " (진행 중)" : ""}`);
  $("plateau").textContent = seg.length ? "평평한 구간 길이: " + seg.join(" · ") : "평평한 구간의 길이가 여기에 기록됩니다.";
}
function heatStep(dt) {
  // 경계를 넘는 순간을 놓치지 않도록 작은 단계로 나누어 적분
  let remain = dt * speed;
  while (remain > 0 && state === "running") {
    const h = Math.min(remain, 0.5); remain -= h;
    const before = Q; t += h; Q = Math.min(Q_END, Q + P * h);
    [["m0", Q_melt0], ["m1", Q_melt1], ["b0", Q_boil0], ["b1", Q_boil1]].forEach(([k, q]) => {
      if (marks[k] == null && before < q && Q >= q) marks[k] = t - (Q - q) / P;
    });
    if (Q >= Q_END) { state = "done"; SIH.label($("heat"), "done", WORDS); }
  }
  const T = stateOf(Q).T, lastPt = pts[pts.length - 1];
  if (t - lastPt[0] >= 1 || state === "done") pts.push([t, T]);
}
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (state === "running") heatStep(dt);
  render(dt);
  requestAnimationFrame(loop);
}
$("heat").onclick = () => {
  if (state === "running") state = "paused"; else if (state !== "done") state = "running";
  SIH.label($("heat"), state, WORDS);
};
$("reset").onclick = () => { state = "idle"; Q = 0; t = 0; pts = [[0, -20]]; marks = {}; initParts(); SIH.label($("heat"), "idle", WORDS); };
initParts();
last = performance.now(); requestAnimationFrame(loop);
</script>
</body>
</html>
