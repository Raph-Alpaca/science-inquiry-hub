<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>산출물 제출하기 — 과학탐구 앱 허브</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/shelf.css">
</head>
<body>
<div id="demoBar" class="demo-bar" hidden>미리보기(데모) 모드입니다. 이 브라우저에만 저장됩니다.</div>

<div class="wrap narrow">
  <header class="head">
    <div>
      <h1>산출물 제출하기</h1>
      <p class="sub" id="sub">책장을 확인하는 중…</p>
    </div>
  </header>

  <main>
    <div id="notice"></div>

    <form class="form" id="form" hidden novalidate>
      <div class="two field">
        <div>
          <label for="grade">학년</label>
          <select id="grade" required><option value="1">1학년</option><option value="2" selected>2학년</option><option value="3">3학년</option></select>
        </div>
        <div>
          <label for="classNo">반</label>
          <select id="classNo" required></select>
        </div>
      </div>

      <div class="field">
        <label for="team">모둠명</label>
        <input type="text" id="team" maxlength="30" placeholder="예: 1모둠" required>
        <p class="err" id="e-team" hidden>모둠명을 적어 주세요.</p>
      </div>

      <div class="field">
        <label for="title">책 제목 (모둠 산출물명)</label>
        <input type="text" id="title" maxlength="60" placeholder="예: 산불 확산 시뮬레이션" required>
        <p class="err" id="e-title" hidden>책 제목을 적어 주세요.</p>
      </div>

      <div class="field">
        <label for="intent">개발자의 의도</label>
        <textarea id="intent" maxlength="600" placeholder="왜 이 시뮬레이션을 만들었나요?" required></textarea>
        <p class="err" id="e-intent" hidden>왜 만들었는지 한두 문장이라도 적어 주세요.</p>
      </div>

      <div class="field">
        <label for="url">시뮬레이션 링크</label>
        <input type="url" id="url" maxlength="500" placeholder="https:// (제미나이·캔바·러버블 공유 링크)" required>
        <p class="err" id="e-url" hidden>https:// 로 시작하는 공유 링크를 붙여넣어 주세요.</p>
      </div>

      <div class="field">
        <label for="howto">사용 방법</label>
        <textarea id="howto" maxlength="600" placeholder="슬라이더를 조절해 보세요…" required></textarea>
        <p class="err" id="e-howto" hidden>어떻게 쓰는지 적어 주세요.</p>
      </div>

      <div class="field">
        <label for="concepts">관련 과학 개념 (쉼표로 구분)</label>
        <input type="text" id="concepts" maxlength="120" placeholder="예: 열평형, 대기 순환">
      </div>

      <div class="field">
        <span class="lab"><label for="members" style="display:inline">모둠원 이름</label><span class="note">공개되지 않고 선생님만 봅니다</span></span>
        <input type="text" id="members" maxlength="200" placeholder="예: 김하늘, 이서준" required>
        <p class="err" id="e-members" hidden>모둠원 이름을 적어 주세요.</p>
      </div>

      <div class="field">
        <span class="lab">표지 고르기</span>
        <div class="covers" id="coverPick" role="group" aria-label="표지 그림 고르기"></div>
        <span class="lab" style="margin-top:12px">표지 색</span>
        <div class="covers" id="colorPick" role="group" aria-label="표지 색 고르기" style="grid-template-columns:repeat(6,1fr)"></div>
        <p class="upload-note">
          <label for="capture" class="btn small" style="cursor:pointer">캡처 이미지 올리기 (선택)</label>
          <span id="capName"></span><br>
          링크가 나중에 끊겨도 책이 남아요. 2 MB 이하 이미지만 올릴 수 있습니다.
        </p>
        <input type="file" id="capture" accept="image/png,image/jpeg,image/webp" class="sr">
        <p class="err" id="e-cap" hidden></p>
      </div>

      <label class="consent"><input type="checkbox" id="agree" required><span>우리 모둠의 작품을 책장에 공개하는 데 동의해요</span></label>
      <p class="err" id="e-agree" hidden>공개 동의에 체크해 주세요.</p>

      <button class="btn primary block" id="send" type="submit">책장에 꽂기</button>
      <p class="upload-note" style="text-align:center;margin-top:10px">선생님 확인 후 책장에 꽂혀요</p>
    </form>

    <div id="done" hidden></div>
  </main>
</div>

<script type="module">
import { DEMO, loadShelf, submitBook, COVERS, COVER_COLORS, coverSrc, clearShelfCache } from "./assets/shelf-data.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const params = new URLSearchParams(location.search);
const code = (params.get("code") || "").trim().toUpperCase();
const suffix = DEMO ? "&demo=1" : "";
let shelf = null, cover = "heat", color = COVER_COLORS[0], file = null;

if (DEMO) $("demoBar").hidden = false;
for (let i = 1; i <= 15; i++) $("classNo").insertAdjacentHTML("beforeend", `<option value="${i}"${i === 3 ? " selected" : ""}>${i}반</option>`);

$("coverPick").innerHTML = COVERS.map((c) => `
  <button type="button" data-k="${c.id}" aria-pressed="false" aria-label="${esc(c.label)} 그림" title="${esc(c.label)}" style="--cover:${COVER_COLORS[0]}">
    <img src="${coverSrc(c.id)}" alt=""></button>`).join("");
$("colorPick").innerHTML = COVER_COLORS.map((c) => `
  <button type="button" data-c="${c}" aria-pressed="false" aria-label="표지 색 ${c}" style="--cover:${c};aspect-ratio:1"></button>`).join("");

function paint() {
  $("coverPick").querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.k === cover ? "true" : "false");
    b.style.setProperty("--cover", color);
  });
  $("colorPick").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.c === color ? "true" : "false"));
}
$("coverPick").onclick = (e) => { const b = e.target.closest("button"); if (b) { cover = b.dataset.k; paint(); save(); } };
$("colorPick").onclick = (e) => { const b = e.target.closest("button"); if (b) { color = b.dataset.c; paint(); save(); } };
$("grade").onchange = () => { color = COVER_COLORS[+$("grade").value - 1] || color; paint(); save(); };
paint();

$("capture").onchange = () => {
  const f = $("capture").files[0];
  $("e-cap").hidden = true;
  if (!f) { file = null; $("capName").textContent = ""; return; }
  if (f.size > 2 * 1024 * 1024) { file = null; $("capture").value = ""; $("capName").textContent = ""; $("e-cap").hidden = false; $("e-cap").textContent = "2 MB 이하 이미지만 올릴 수 있어요."; return; }
  file = f;
  $("capName").textContent = " " + f.name;
};

/* 이전 입력 되살리기 */
const KEY = "sih-submit-" + code;
const FIELDS = ["grade", "classNo", "team", "title", "intent", "url", "howto", "concepts", "members"];
function save() {
  const o = {}; FIELDS.forEach((f) => (o[f] = $(f).value)); o.cover = cover; o.color = color;
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) { /* 무시 */ }
}
function restore() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!o) return;
    FIELDS.forEach((f) => { if (o[f] != null) $(f).value = o[f]; });
    cover = o.cover || cover; color = o.color || color; paint();
  } catch (e) { /* 무시 */ }
}
FIELDS.forEach((f) => $(f).addEventListener("input", save));

(async function start() {
  if (!code) {
    $("sub").textContent = "책장 코드가 필요합니다";
    $("notice").innerHTML = `<div class="notice"><h2>선생님께 책장 코드를 받으세요</h2>
      <p>선생님이 알려 준 주소로 들어와야 어느 책장에 넣을지 알 수 있어요.</p></div>`;
    return;
  }
  try {
    const data = await loadShelf(code);
    shelf = data.shelf;
    if (!shelf) {
      $("sub").textContent = "책장을 찾지 못했습니다";
      $("notice").innerHTML = `<div class="notice bad"><h2>이런 코드의 책장이 없어요</h2>
        <p><b>${esc(code)}</b> 를 다시 확인해 주세요.</p></div>`;
      return;
    }
    $("sub").innerHTML = `<span class="code-chip"><small>책장 코드</small><b>${esc(shelf.code)}</b></span> · ${esc(shelf.school)}`;
    $("form").hidden = false;
    restore();
  } catch (err) {
    $("sub").textContent = "책장을 확인하지 못했습니다";
    $("notice").innerHTML = `<div class="notice bad"><h2>연결에 문제가 있어요</h2><p>잠시 뒤 다시 시도해 주세요.</p>
      <p class="link">${esc(err.message || err)}</p></div>`;
  }
})();

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = (id) => $(id).value.trim();
  let bad = null;
  const need = [["team", v("team")], ["title", v("title")], ["intent", v("intent")], ["howto", v("howto")], ["members", v("members")]];
  need.forEach(([id, val]) => {
    const empty = !val;
    $("e-" + id).hidden = !empty;
    $(id).setAttribute("aria-invalid", empty ? "true" : "false");
    if (empty && !bad) bad = $(id);
  });
  const url = v("url");
  const urlBad = !/^https:\/\/.+/i.test(url);
  $("e-url").hidden = !urlBad;
  $("url").setAttribute("aria-invalid", urlBad ? "true" : "false");
  if (urlBad && !bad) bad = $("url");
  const agreeBad = !$("agree").checked;
  $("e-agree").hidden = !agreeBad;
  if (agreeBad && !bad) bad = $("agree");
  if (bad) { bad.focus(); return; }

  $("send").disabled = true;
  $("send").textContent = "보내는 중…";
  try {
    await submitBook(shelf, {
      grade: +v("grade"), classNo: +v("classNo"), team: v("team"), title: v("title"), url,
      intent: v("intent"), howto: v("howto"),
      concepts: v("concepts").split(",").map((s) => s.trim()).filter(Boolean).slice(0, 8),
      coverKind: cover, coverColor: color, memberNames: v("members"),
    }, file);
    clearShelfCache(code);
    try { localStorage.removeItem(KEY); } catch (err) { /* 무시 */ }
    $("form").hidden = true;
    $("done").hidden = false;
    $("done").innerHTML = `<div class="notice">
      <h2>보냈어요. 선생님 확인 후 책장에 꽂혀요</h2>
      <p>선생님이 승인하면 우리 학교 책장에서 볼 수 있습니다. 모둠원 이름은 공개되지 않습니다.</p>
      <p><a class="btn primary" href="shelf.html?code=${encodeURIComponent(code)}${suffix}">책장 보러 가기</a>
      <a class="btn" href="submit.html?code=${encodeURIComponent(code)}${suffix}">하나 더 제출하기</a></p></div>`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    $("send").disabled = false;
    $("send").textContent = "책장에 꽂기";
    $("notice").innerHTML = `<div class="notice bad"><h2>보내지 못했어요</h2>
      <p>잠시 뒤 다시 눌러 보세요. 계속 안 되면 선생님께 알려 주세요.</p>
      <p class="link">${esc(err.message || err)}</p></div>`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});
</script>
</body>
</html>
