<script type="module">
import {
  DEMO, CONFIGURED, onUser, login, logout, myShelves, createShelf, regenerateCode,
  listBooks, loadMembers, setStatus, updateBook, deleteBook, clearShelfCache,
  checkAccess, watchAccess, addAllowed, removeAllowed, watchAllowed, watchAllShelves, renameShelf, deleteShelf,
  watchShelfBooks,
} from "./assets/shelf-data.js";
import { SITE } from "./assets/site-config.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const suffix = DEMO ? "&demo=1" : "";
// /teacher 같은 짧은 주소로 열려도 맞도록, 파일 이름을 떼지 않고 현재 주소의 폴더를 구한다
const here = new URL(".", location.href).href;
// 학생에게 알려 줄 주소. 학생용 사이트를 따로 두었으면(assets/site-config.js) 그 주소로 만든다.
const shelfUrl = (code) => (!DEMO && SITE.studentLink && SITE.studentLink.includes("{code}"))
  ? SITE.studentLink.replace("{code}", encodeURIComponent(code))
  : `${here}shelf.html?code=${encodeURIComponent(code)}${suffix}`;
// 옆 패널 미리보기는 항상 이 사이트의 shelf.html 을 쓴다 (파일이 같으므로 학생용 사이트와 똑같이 보인다).
// 코드를 여러 개 주면(쉼표로 이어서) 그 책장들의 서가를 한 화면에 이어 보여 준다 ("책장 함께 보기").
const peekUrl = (codes) => `${here}shelf.html?code=${encodeURIComponent([].concat(codes).join(","))}${suffix}`;
let user = null, shelves = [], data = {}, tab = {};
const mergeSel = new Set(), mergeKnown = new Set();   // 함께 볼 책장 (새 책장은 처음엔 골라 둔다)
let access = { admin: false, approved: false }, allowed = [], allShelves = [], adminLoaded = false;

if (DEMO) $("demoBar").hidden = false;

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg; el.setAttribute("role", "status");
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(what + " 복사했어요"); }
  catch (e) { window.prompt(what + "를 복사하세요", text); }
}

/* ---------- 지우기 안전장치 ----------
 * 1) 확인창: 무엇이 지워지는지 보여 주고, 책장은 책장 이름을, 책은 "삭제"를 직접 적어야 단추가 켜진다.
 * 2) 되돌리기: 확인해도 바로 지우지 않는다. 화면에서만 먼저 빼고 UNDO_SEC 초 동안 "되돌리기"를 띄운 뒤 지운다.
 *    그 사이 창을 닫으면 지우지 않는다(안전한 쪽). 로그아웃할 때는 기다리던 것을 마저 지운다. */
const UNDO_SEC = 10;
const pendingDel = new Map();                 // "shelf:id" · "book:id" · "allowed:email" → { run, timer }
const gone = (key) => pendingDel.has(key);
const liveShelves = () => shelves.filter((s) => !gone("shelf:" + s.id));
const liveBooks = (s) => (data[s.id]?.books || []).filter((b) => !gone("book:" + b.id));

function askDanger({ title, what, note = "", word = "", wordLabel = "", ok, backup = false }) {
  const dlg = $("dangerDlg"), input = $("dg-type"), okBtn = $("dg-ok");
  $("dg-title").textContent = title;
  $("dg-what").textContent = what;
  $("dg-note").textContent = note; $("dg-note").hidden = !note;
  $("dg-typebox").hidden = !word;
  $("dg-typelabel").textContent = wordLabel;
  $("dg-backupbox").hidden = !backup; $("dg-backup").checked = true;
  input.value = "";
  okBtn.textContent = ok;
  const norm = (v) => v.replace(/\s+/g, " ").trim();
  const check = () => { okBtn.disabled = !!word && norm(input.value) !== norm(word); };
  check();
  input.oninput = check; input.oncompositionend = check;   // 한글 입력이 끝났을 때도 다시 본다
  return new Promise((resolve) => {
    let answered = false;
    const finish = (yes) => {
      if (answered) return; answered = true;
      if (dlg.open) dlg.close();
      resolve(yes ? { backup: backup && $("dg-backup").checked } : null);
    };
    okBtn.onclick = () => { if (!okBtn.disabled) finish(true); };
    $("dg-cancel").onclick = () => finish(false);
    $("dg-form").onsubmit = (ev) => { ev.preventDefault(); if (!okBtn.disabled) finish(true); };
    dlg.onclose = () => finish(false);         // Esc 로 닫아도 취소
    dlg.showModal();
    (word ? input : $("dg-cancel")).focus();   // 적을 것이 없으면 "취소"에 먼저 초점
  });
}

function deleteLater(key, label, run, restore) {
  let stack = $("undoStack");
  if (!stack) { stack = document.createElement("div"); stack.id = "undoStack"; stack.className = "undo-stack"; document.body.appendChild(stack); }
  const el = document.createElement("div");
  el.className = "undo-toast"; el.setAttribute("role", "status"); el.dataset.key = key;
  el.innerHTML = `<span>${esc(label)} <small>${UNDO_SEC}초 뒤 지워집니다</small></span><button class="btn small" type="button">되돌리기</button>`;
  stack.appendChild(el);
  let left = UNDO_SEC;
  const tick = setInterval(() => { left -= 1; el.querySelector("small").textContent = `${Math.max(left, 0)}초 뒤 지워집니다`; }, 1000);
  const entry = {};
  const done = () => { clearInterval(tick); clearTimeout(entry.timer); el.remove(); pendingDel.delete(key); };
  entry.cancel = () => { done(); restore(); };
  entry.run = async () => {
    done();
    try { await run(); }
    catch (e) { toast("지우지 못했어요: " + (e.code || e.message)); restore(); }
  };
  entry.timer = setTimeout(entry.run, UNDO_SEC * 1000);
  el.querySelector("button").onclick = () => { entry.cancel(); toast("되돌렸습니다"); };
  pendingDel.set(key, entry);
  return entry;
}
// 로그아웃 전에: 기다리던 삭제를 마저 한다
async function flushDeletes() { await Promise.all([...pendingDel.values()].map((e) => e.run())); }
// 기다리는 삭제가 있을 때 창을 닫으려 하면 한 번 묻는다 (닫으면 지우지 않는다)
window.addEventListener("beforeunload", (ev) => {
  if (!pendingDel.size) return;
  ev.preventDefault(); ev.returnValue = "";
});
function redraw() { if (user && access.approved) render(); }

/* ---------- 로그인 ----------
 * 승인 여부는 한 번 읽고 끝내지 않고 계속 지켜본다(watchAccess).
 *  - 로그인 직후 연결이 잠시 흔들려도 서버가 확인해 준 값이 올 때까지 기다리므로, 승인된 선생님이
 *    대기 화면을 보거나 새로고침해야 하는 일이 없다.
 *  - 관리자가 승인(취소)하면 그 순간 화면이 넘어간다. */
let stopAccess = null;
onUser((u) => {
  user = u;
  $("logout").hidden = !u;
  if (stopAccess) { stopAccess(); stopAccess = null; }
  if (!u) { renderSignedOut(); return; }
  $("who").textContent = `${u.displayName || "선생님"}${u.email ? ` (${u.email})` : ""}`;
  access = { admin: false, approved: false };
  renderChecking();
  let approvedBefore = false;
  stopAccess = watchAccess(u, async (next) => {
    access = next;
    if (!next.approved) { approvedBefore = false; stopAdmin(); renderPending(u); return; }
    if (approvedBefore) return;            // 이미 책장 화면이면 그대로 둔다
    approvedBefore = true;
    await reload();
  });
});
$("logout").onclick = async () => { await flushDeletes(); await logout(); location.reload(); };

function renderChecking() {
  $("main").innerHTML = `
    <div class="notice" id="checking">
      <h2>사용 승인을 확인하는 중입니다…</h2>
      <p class="upload-note">잠시만 기다려 주세요.</p>
    </div>`;
  // 연결이 느리면 그 사실을 알려 준다 (기다리면 저절로 넘어간다)
  setTimeout(() => {
    const el = $("checking");
    if (el) el.insertAdjacentHTML("beforeend", `<p class="upload-note" style="color:var(--amber-ink)">서버 연결이 평소보다 느립니다. 연결되면 저절로 넘어갑니다. 오래 걸리면 새로고침해 보세요.</p>`);
  }, 8000);
}

function renderSignedOut() {
  $("who").textContent = "로그인하면 우리 학교 책장을 만들 수 있어요";
  $("main").innerHTML = `
    <div class="notice">
      <h2>구글 계정으로 로그인하세요</h2>
      <p>선생님이 하실 일은 네 가지뿐입니다. 로그인 → 학교 책장 만들기 → 학생에게 코드 알려 주기 → 제출된 책 승인하기.</p>
      <p class="upload-note">미리 사용 승인을 받은 계정만 책장을 만들 수 있습니다. 아직 신청 전이라면 관리자에게 쓰실 구글 계정 주소를 알려 주세요.</p>
      <p><button class="btn primary" id="loginBtn">구글로 로그인</button></p>
      ${CONFIGURED ? "" : `<p class="link" style="color:var(--amber-ink)">아직 Firebase 설정이 들어오지 않아 미리보기(데모)로 열립니다. 설정을 넣으면 실제 저장이 됩니다.</p>`}
    </div>
    <div class="steps3" style="margin-top:20px">
      <div class="step"><span class="n">1</span><div><b>로그인해요</b><small>구글 계정</small></div></div>
      <div class="step"><span class="n">2</span><div><b>학생에게 책장 코드를 알려 주세요</b><small>칠판에 적거나 QR을 띄우면 됩니다</small></div></div>
      <div class="step"><span class="n">3</span><div><b>제출된 책을 승인하면 책장에 꽂혀요</b><small>승인 전에는 공개되지 않습니다</small></div></div>
    </div>`;
  $("loginBtn").onclick = async () => {
    try { await login(); } catch (e) { toast("로그인하지 못했어요: " + (e.code || e.message)); }
  };
}

/* ---------- 승인 대기 ---------- */
function renderPending(u) {
  $("main").innerHTML = `
    <div class="notice">
      <h2>아직 사용 승인이 되지 않은 계정입니다</h2>
      <p>관리자에게 아래 주소를 알려 주시면 승인해 드립니다. 승인되면 이 화면이 저절로 넘어갑니다.</p>
      <div class="qr-box" style="gap:12px">
        <b style="font-size:18px" id="myMail">${esc(u.email || "")}</b>
        <button class="btn small" id="copyMail">주소 복사</button>
      </div>
      <p class="upload-note" style="margin-top:14px">다른 계정으로 신청하셨다면 로그아웃한 뒤 그 계정으로 다시 로그인해 주세요.</p>
      <p><button class="btn" id="recheck">승인됐는지 다시 확인</button></p>
    </div>
    ${access.denied ? `
    <div class="notice bad" style="margin-top:16px">
      <h2>저장소 규칙이 아직 옛 버전입니다</h2>
      <p>승인 명단을 읽으려다 거부되었습니다. 관리자 문서를 만들어도 규칙이 옛 버전이면 이 화면이 계속 뜹니다.
      Firebase 콘솔 → Firestore → 규칙 탭에 저장소의 <b>firestore.rules</b> 내용을 붙여 넣고 <b>게시</b>한 뒤,
      위의 "승인됐는지 다시 확인"을 누르세요.</p>
      <p class="link">npx firebase deploy --only firestore:rules</p>
    </div>` : ""}`;
  $("copyMail").onclick = () => copy(u.email || "", "주소를");
  // 승인되면 watchAccess 가 저절로 넘겨 준다. 이 단추는 서버에서 한 번 더 읽어 확인해 주는 용도.
  $("recheck").onclick = async () => {
    const btn = $("recheck"); btn.disabled = true;
    const next = await checkAccess(u).catch(() => ({ approved: false, offline: true }));
    btn.disabled = false;
    if (next.approved) { access = next; toast("승인됐습니다"); await reload(); }
    else if (next.offline) toast("서버에 연결되지 않아요. 잠시 뒤 다시 눌러 보세요");
    else toast("아직 승인 전입니다");
  };
}

/* ---------- 관리자: 선생님 승인 ---------- */
const liveAllowed = () => allowed.filter((a) => !gone("allowed:" + a.id));
function adminCard() {
  return `
  <section class="card shelf-card" id="adminCard">

function wireAdmin() {
  const add = $("ad-add");
  if (!add) return;
  add.onclick = async () => {
    const mail = $("ad-mail").value.trim();
    if (!mail) { toast("이메일을 적어 주세요"); return; }
    add.disabled = true;
    try {
      const school = $("ad-school").value.trim();
      const waiting = pendingDel.get("allowed:" + mail.toLowerCase());
      if (waiting) waiting.cancel();
      const key = await addAllowed({ email: mail, school, by: user.email || "" });
      $("ad-mail").value = ""; $("ad-school").value = "";
      toast("승인했습니다");
      // 구독이 곧 같은 내용을 보내 주지만, 연결이 느릴 때도 바로 보이도록 먼저 표에 넣는다
      allowed = allowed.filter((a) => a.id !== key).concat({ id: key, email: key, school, addedAt: Date.now() })
        .sort((a, b) => (a.email || "").localeCompare(b.email || ""));
      adminLoaded = true; renderAdminCard();
    } catch (e) { toast("추가하지 못했어요: " + (e.code || e.message)); }
    add.disabled = false;
  };
  document.querySelectorAll("[data-ad]").forEach((b) => (b.onclick = async () => {
    const mail = b.dataset.ad, row = allowed.find((a) => a.id === mail);
    const yes = await askDanger({
      title: "사용 승인 취소",
      what: `${mail}${row && row.school ? ` (${row.school})` : ""}`,
      note: "이 계정은 더 이상 책장을 만들거나 관리할 수 없습니다. 이미 만든 책장과 책은 그대로 남습니다.",
      ok: "승인 취소",
    });
    if (!yes) return;
    deleteLater("allowed:" + mail, `${mail} 승인 취소`,
      async () => {
        await removeAllowed(mail);
        allowed = allowed.filter((a) => a.id !== mail); renderAdminCard();
        toast("승인을 취소했습니다");
      },
      () => renderAdminCard());
    renderAdminCard();
  }));
}
/* 승인 명단·전체 책장은 구독으로 받는다. 방금 추가·취소한 것은 서버 응답을 기다리지 않고 바로 표에 뜬다. */
let stopAdminWatch = null;
function watchAdmin() {
  if (stopAdminWatch) return;
  const warn = (e) => console.warn("관리자 명단 실시간 반영 오류:", e.code || e.message);
  const unA = watchAllowed((list) => { allowed = list; adminLoaded = true; renderAdminCard(); }, warn);
  const unS = watchAllShelves((list) => { allShelves = list; renderAdminCard(); }, warn);
  stopAdminWatch = () => { unA(); unS(); };
}
function stopAdmin() {
  if (stopAdminWatch) { stopAdminWatch(); stopAdminWatch = null; }
  allowed = []; allShelves = []; adminLoaded = false;
}
// 관리자 카드만 다시 그린다 (적던 글자와 커서는 그대로)
function renderAdminCard() {

/* ---------- 책장 목록 ---------- */
async function reload() {
  try {
    shelves = await myShelves(user.uid);
  } catch (e) {
    const deny = e && (e.code === "permission-denied" || /insufficient permissions/i.test(e.message || ""));
    $("main").innerHTML = `<div class="notice bad"><h2>${deny ? "저장소 보안 규칙을 아직 올리지 않았어요" : "책장을 불러오지 못했어요"}</h2>
      <p>${deny ? "프로젝트 폴더에서 아래 명령을 한 번 실행하면 열립니다." : "잠시 뒤 새로고침해 주세요."}</p>
      <p class="link">${deny ? "npx firebase login<br>npx firebase deploy --only firestore:rules --project science-inquiry-hub" : esc(e.message || e)}</p></div>`;
    return;
  }
  await Promise.all(shelves.map(async (s) => {
    const books = await listBooks(s.id);
    const members = await loadMembers(s.id, books.map((b) => b.id));
    data[s.id] = { books, members };
    tab[s.id] = tab[s.id] || "pending";
  }));
  if (access.admin) watchAdmin();
  render();
  refreshPeek();
  watchAll();
}

/* ---------- 실시간 반영: 학생이 제출하면 새로고침 없이 목록에 뜬다 ---------- */
const watchers = new Map();   // 책장 id → 구독 끊기 함수
function watchAll() {
  const ids = new Set(shelves.map((s) => s.id));
  for (const [id, stop] of watchers) if (!ids.has(id)) { stop(); watchers.delete(id); }
  shelves.forEach((s) => {
    if (watchers.has(s.id)) return;
    watchers.set(s.id, watchShelfBooks(s.id, (next) => onLive(s.id, next), (e) => console.warn("실시간 반영 오류:", e.code || e.message)));
  });
}
function onLive(shelfId, next) {
  const cur = data[shelfId];
  if (!cur || !shelves.some((s) => s.id === shelfId)) return;
  if (JSON.stringify(cur) === JSON.stringify(next)) return;
  const known = new Set(cur.books.map((b) => b.id));
  const arrived = next.books.filter((b) => !known.has(b.id) && b.status === "pending");
  data[shelfId] = next;
  liveRender();
  if (arrived.length) toast(arrived.length === 1 ? `새 제출: ${arrived[0].title}` : `새 제출 ${arrived.length}권이 들어왔어요`);
}
// 다시 그려도 적던 글자와 커서 위치는 그대로 둔다
function liveRender() {
  if (!shelves.length || !$("main").querySelector(".shelf-card[data-s]")) return;
  const kept = [...$("main").querySelectorAll("input[id], textarea[id]")].map((el) => [el.id, el.value]);
  const active = document.activeElement && $("main").contains(document.activeElement) ? document.activeElement : null;
  const focusKey = active && (active.id || active.dataset.a);
  render();
  kept.forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
  if (focusKey) {
    const el = $(focusKey) || $("main").querySelector(`[data-a="${focusKey}"]`);
    if (el) el.focus({ preventScroll: true });
  }
}
function render() {
  const shown = liveShelves();
  if (!shown.length) { renderFirstRun(); return; }
  const pending = shown.reduce((n, s) => n + liveBooks(s).filter((b) => b.status === "pending").length, 0);
  const first = shown[0];
  $("main").innerHTML = `
    <div class="steps3">
      <div class="step done"><span class="n">1</span><div><b>로그인했어요</b><small>완료</small></div></div>
      <div class="step"><span class="n">2</span><div><b>학생에게 책장 코드를 알려 주세요</b><small>${esc(first.code)}</small></div></div>
      <div class="step"><span class="n">3</span><div><b>제출된 책을 승인하면 책장에 꽂혀요</b><small>${pending ? `대기 ${pending}권` : "대기 없음"}</small></div></div>
    </div>

    ${access.admin ? adminCard() : ""}`;
  wire();
  wireAdmin();
}
// 책장이 둘 이상일 때만: 고른 책장들을 미리보기 창에 이어서 본다
function mergeBar() {
  const shown = liveShelves();

    ${rows.length ? `
    <table class="books">
      <thead><tr><th>학년-반</th><th>책 제목</th><th>모둠원 (선생님만)</th><th>링크</th><th>제출일</th><th>개발자의 의도</th><th></th></tr></thead>
      <tbody>${rows.map((b) => bookRow(s, b, d.members[b.id])).join("")}</tbody>
    </table>` : `<p class="upload-note" style="margin:18px 0 0">${t === "pending" ? "승인을 기다리는 책이 없습니다." : t === "approved" ? "아직 승인한 책이 없습니다." : "숨긴 책이 없습니다."}</p>`}
    ${t === "pending" && counts.pending ? `
    <div class="bulk">
      <button class="btn dark" data-a="approveAll">대기 중인 ${counts.pending}권 모두 승인</button>

function bookRow(s, b, members) {

/* ---------- 첫 방문: 책장 만들기 ---------- */

/* ---------- 동작 연결 ---------- */
function wire() {
  const mb = $("mergeBar");
  if (mb) {
    mb.querySelectorAll("input[data-m]").forEach((cb) => (cb.onchange = () => {
      if (cb.checked) mergeSel.add(cb.dataset.m); else mergeSel.delete(cb.dataset.m);
    }));
    $("mergeGo").onclick = () => {
      const picked = liveShelves().filter((s) => mergeSel.has(s.id));
      if (picked.length < 2) { toast("책장을 두 개 이상 골라 주세요"); return; }
      openPeek(picked, $("mergeGo"));
    };
  }
  $("addShelf").onclick = () => {
    const s = liveShelves()[0];
    renderFirstRun({ school: s.school, teacherName: s.teacherName });
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  };
  document.querySelectorAll(".shelf-card").forEach((card) => {
    const s = shelves.find((x) => x.id === card.dataset.s);
    card.querySelectorAll("[role=tab]").forEach((b) => (b.onclick = () => { tab[s.id] = b.dataset.t; render(); }));
    card.onclick = async (ev) => {
      const btn = ev.target.closest("[data-a]");
      if (!btn) return;
      const row = ev.target.closest("tr[data-b]");
      const book = row ? data[s.id].books.find((b) => b.id === row.dataset.b) : null;
      const a = btn.dataset.a;
      if (a === "copyCode") return copy(s.code, "코드를");
      if (a === "copyUrl") return copy(shelfUrl(s.code), "주소를");
      if (a === "qr") return showQr(s);
      if (a === "peek") return openPeek(s, btn);
      if (a === "csv") return exportCsv(s);
      if (a === "settings") return openSettings(s);
      if (a === "approveAll") {
        const ids = liveBooks(s).filter((b) => b.status === "pending").map((b) => b.id);
        await setStatus(s, ids, "approved");
        clearShelfCache(s.code); await reload(); toast(`${ids.length}권을 승인했어요`);
        return;
      }
      if (!book) return;
      if (a === "approve" || a === "hide") {
        await setStatus(s, [book.id], a === "approve" ? "approved" : "hidden");
        clearShelfCache(s.code); await reload();
        toast(a === "approve" ? "승인했어요" : "숨겼어요");
        return;
      }
      if (a === "edit") openEdit(s, book);
    };
  });
}

/* ---------- 학생 화면 보기 (옆 패널) ----------
 * 책장 하나를 주면 학생이 보는 그대로, 여러 개를 주면 서가를 이어 붙인 "함께 보기"로 연다. */
let peekShelves = [], peekFrom = null;
const peekWideKey = "sih-peek-wide";
function fillPeek(list) {
  peekShelves = list;
  const codes = list.map((s) => s.code);
  $("peekKind").textContent = list.length > 1 ? "책장 함께 보기 (선생님용)" : "학생이 보는 화면";
  $("peekName").textContent = list.length > 1
    ? `${list.map((s) => s.title).join(" + ")} · ${codes.join(", ")}`
    : `${list[0].title} · ${codes[0]}`;
  $("peekOpen").href = peekUrl(codes);
  $("peekFrame").src = peekUrl(codes);
}
function openPeek(s, from) {
  peekFrom = from || null;
  const el = $("peek");
  fillPeek([].concat(s));
  let wide = false;
  try { wide = localStorage.getItem(peekWideKey) === "1"; } catch (e) { /* 무시 */ }
  setPeekWide(wide);
  el.hidden = false;
  document.body.classList.add("peeking");
  requestAnimationFrame(() => el.classList.add("on"));
  $("peekClose").focus();
}
function closePeek() {
  const el = $("peek");
  if (el.hidden) return;
  el.classList.remove("on");
  document.body.classList.remove("peeking");
  const done = () => { el.hidden = true; $("peekFrame").src = "about:blank"; };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) done(); else setTimeout(done, 240);
  if (peekFrom && document.contains(peekFrom)) peekFrom.focus();
  peekShelves = [];
}
function refreshPeek() {
  if ($("peek").hidden || !peekShelves.length) return;
  const live = peekShelves.map((p) => liveShelves().find((x) => x.id === p.id)).filter(Boolean);
  if (!live.length) { closePeek(); return; }          // 책장을 지웠으면 닫는다
  // 화면을 다시 그리면 단추도 새로 만들어지므로, 닫을 때 돌아갈 단추를 다시 찾아 둔다
  peekFrom = (live.length > 1 ? $("mergeGo") : document.querySelector(`.shelf-card[data-s="${live[0].id}"] [data-a="peek"]`)) || peekFrom;
  fillPeek(live);                                      // 승인·숨김 직후 새로 그린다
}
function setPeekWide(wide) {
  $("peek").classList.toggle("wide", wide);
  document.body.classList.toggle("peek-wide", wide);
  $("peekWide").setAttribute("aria-pressed", String(wide));
  $("peekWide").textContent = wide ? "좁게" : "넓게";
  $("peekWide").title = wide ? "휴대전화 폭으로 보기" : "컴퓨터 화면 폭으로 보기";
}
$("peekWide").onclick = () => {
  const wide = !$("peek").classList.contains("wide");
  setPeekWide(wide);
  try { localStorage.setItem(peekWideKey, wide ? "1" : "0"); } catch (e) { /* 무시 */ }
};
$("peekReload").onclick = () => { if (peekShelves.length) { peekShelves.forEach((s) => clearShelfCache(s.code)); refreshPeek(); } };
$("peekClose").onclick = closePeek;
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && !$("peek").hidden && !document.querySelector("dialog[open]")) closePeek();
});

/* ---------- QR ---------- */
async function showQr(s) {
  const url = shelfUrl(s.code);
  $("qrTitle").textContent = `${s.title} 책장 코드`;
  $("qrCode").textContent = s.code;
  $("qrUrl").textContent = url;
  $("qrHere").innerHTML = `<p class="upload-note">QR을 만드는 중…</p>`;
  $("qrDlg").showModal();
  try {
    const { qrSvg } = await import("./assets/qr.js");
    $("qrHere").innerHTML = qrSvg(url, { size: 220, title: `${s.title} 책장 주소` });
  } catch (e) {
    $("qrHere").innerHTML = `<p class="upload-note">QR을 만들지 못했어요. 아래 주소를 알려 주세요.</p>`;
  }
}
$("qrClose").onclick = () => $("qrDlg").close();
$("qrPrint").onclick = () => window.print();

/* ---------- CSV ---------- */
function exportCsv(s) {
  const d = data[s.id];
  const head = ["학년", "반", "모둠", "책 제목", "링크", "개발자의 의도", "사용 방법", "관련 과학 개념", "모둠원", "상태", "제출일"];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [head.map(q).join(",")].concat(d.books.map((b) => [
    b.grade, b.classNo, b.team, b.title, b.url, b.intent, b.howto, (b.concepts || []).join(" / "),
    d.members[b.id] || "", { pending: "대기", approved: "승인", hidden: "숨김" }[b.status] || b.status,
    b.createdAt ? new Date(b.createdAt).toLocaleDateString("ko-KR") : "",
  ].map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${s.title}-산출물.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV를 내려받았어요");
}

/* ---------- 책장 설정 (이름 바꾸기·코드 재발급·삭제) ---------- */
let editingShelf = null;
function openSettings(s) {
  editingShelf = s;
  $("sh-school").value = s.school || "";
  $("sh-name").value = s.teacherName || "";
  $("sh-title").value = s.title || "";
  $("sh-code").textContent = s.code;
  const n = (data[s.id]?.books || []).length;
  $("sh-delnote").textContent = n
    ? `이 책장과 안에 든 책 ${n}권, 모둠원 이름까지 모두 지워집니다. 누르면 책장 이름을 한 번 더 적어 확인하고, 지운 뒤 ${UNDO_SEC}초 안에는 되돌릴 수 있습니다.`
    : `이 책장을 지웁니다. 누르면 책장 이름을 한 번 더 적어 확인합니다.`;
  $("shelfDlg").showModal();
}
$("sh-cancel").onclick = () => $("shelfDlg").close();
$("sh-save").onclick = async () => {
  if (!editingShelf) return;
  const school = $("sh-school").value.trim(), teacherName = $("sh-name").value.trim(), title = $("sh-title").value.trim();
  if (!school || !teacherName || !title) { toast("빈 칸을 채워 주세요"); return; }
  const s = editingShelf;
  $("shelfDlg").close();
  try {
    await renameShelf(s, { school, teacherName, title });
    clearShelfCache(s.code);
    await reload(); toast("바꿨습니다");
  } catch (e) { toast("바꾸지 못했어요: " + (e.code || e.message)); }
};
$("sh-recode").onclick = async () => {
  if (!editingShelf) return;
  if (!confirm("코드를 새로 만들면 예전 코드로는 제출할 수 없습니다. 계속할까요?")) return;
  const s = editingShelf, before = s.code;
  try {
    s.code = await regenerateCode(s);
    clearShelfCache(before); clearShelfCache(s.code);
    $("sh-code").textContent = s.code;
    await reload(); toast("새 코드: " + s.code);
  } catch (e) { toast("바꾸지 못했어요: " + (e.code || e.message)); }
};
$("sh-del").onclick = async () => {
  if (!editingShelf) return;
  const s = editingShelf;
  const books = data[s.id]?.books || [];
  const approved = books.filter((b) => b.status === "approved").length;
  const yes = await askDanger({
    title: "책장 지우기",
    what: `"${s.title}" (코드 ${s.code}) · 책 ${books.length}권${approved ? `, 그중 공개 중 ${approved}권` : ""}`,
    note: books.length
      ? "책장과 안에 든 책, 모둠원 이름까지 모두 지워집니다. 학생들이 보던 공개 책장도 사라지고, 지운 뒤에는 되살릴 수 없습니다."
      : "빈 책장입니다. 지우면 이 코드로는 더 이상 제출할 수 없습니다.",
    word: s.title,
    wordLabel: `확인을 위해 책장 이름 "${s.title}"을(를) 그대로 적어 주세요`,
    ok: "이 책장 지우기",
    backup: books.length > 0,
  });
  if (!yes) return;
  $("shelfDlg").close();
  if (yes.backup) exportCsv(s);
  deleteLater("shelf:" + s.id, `"${s.title}" 책장 지우기`,
    async () => {
      await deleteShelf(s);
      clearShelfCache(s.code);
      delete data[s.id];
      await reload(); toast("책장을 지웠습니다");
    },
    () => redraw());
  redraw();
  refreshPeek();
};

/* ---------- 수정 ---------- */
let editing = null;
function openEdit(s, b) {
  editing = { s, b };
  $("ed-title").value = b.title || "";
  $("ed-url").value = b.url || "";
  $("ed-grade").value = String(b.grade || 1);
  $("ed-class").value = b.classNo || 1;
  $("ed-team").value = b.team || "";
  $("ed-intent").value = b.intent || "";
  $("ed-howto").value = b.howto || "";
  $("ed-concepts").value = (b.concepts || []).join(", ");
  $("ed-members").textContent = data[s.id].members[b.id] || "(없음)";
  $("ed-example").checked = !!b.example;
  $("editDlg").showModal();
}
$("ed-cancel").onclick = () => $("editDlg").close();
$("ed-save").onclick = async () => {
  if (!editing) return;
  const { s, b } = editing;
  const patch = {
    title: $("ed-title").value.trim(), url: $("ed-url").value.trim(),
    grade: +$("ed-grade").value, classNo: +$("ed-class").value, team: $("ed-team").value.trim(),
    intent: $("ed-intent").value.trim(), howto: $("ed-howto").value.trim(),
    concepts: $("ed-concepts").value.split(",").map((x) => x.trim()).filter(Boolean).slice(0, 8),
    example: $("ed-example").checked,
  };
  $("editDlg").close();
  await updateBook(s.id, b.id, patch);
  clearShelfCache(s.code); await reload(); toast("저장했어요");
};
$("ed-delete").onclick = async () => {
  if (!editing) return;
  const { s, b } = editing;
  const yes = await askDanger({
    title: "책 삭제",
    what: `"${b.title}" · ${b.grade}학년 ${b.classNo}반 ${b.team || ""}`.trim(),
    note: "학생이 제출한 내용과 모둠원 이름이 지워지고 되살릴 수 없습니다. 학생에게 안 보이게만 하려면 삭제 대신 목록의 \"숨김\"을 쓰세요.",
    word: "삭제",
    wordLabel: "확인을 위해 \"삭제\"라고 적어 주세요",
    ok: "이 책 삭제",
  });
  if (!yes) return;
  $("editDlg").close();
  deleteLater("book:" + b.id, `"${b.title}" 삭제`,
    async () => { await deleteBook(s.id, b.id); clearShelfCache(s.code); await reload(); toast("삭제했어요"); },
    () => redraw());
  redraw();
};
</script>
